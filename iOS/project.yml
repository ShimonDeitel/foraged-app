name: Foraged
options:
  bundleIdPrefix: com.shimondeitel.foraged
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Foraged:
    type: application
    platform: iOS
    sources:
      - path: Foraged
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.foraged
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Foraged/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  ForagedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ForagedTests
      - path: Foraged.storekit
    dependencies:
      - target: Foraged
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.foraged.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  ForagedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ForagedUITests
    dependencies:
      - target: Foraged
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.foraged.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Foraged:
    build:
      targets:
        Foraged: all
        ForagedTests: [test]
        ForagedUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Foraged.storekit
    test:
      config: Debug
      storeKitConfiguration: Foraged.storekit
      targets:
        - ForagedTests
        - ForagedUITests
    archive:
      config: Release
